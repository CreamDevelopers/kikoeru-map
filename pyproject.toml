[project]
name = "kikoeru-chizu"
version = "1.0.0"
description = "きこえる地図 - 日本各地の環境音を地図に置いて共有するWebサービス"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.120",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "gunicorn>=23.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0,<6",
    "arq>=0.26",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "segno>=1.6",
    "numpy>=1.26",
    "webrtcvad-wheels>=2.0.14",
    "pillow>=10.4",
    "prometheus-client>=0.20",
    "brotli-asgi>=1.4",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.26",
    "asgi-lifespan>=2.1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
    "S101",
    "S311",
    "S603",
    "S607",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
    "S104",
    "E501",
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
files = ["app"]

# redis-py の非同期クライアントは型定義が await と噛み合わないため除外する
[[tool.mypy.overrides]]
module = ["redis", "redis.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
