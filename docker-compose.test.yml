services:
  test:
    build:
      context: .
      target: test
    image: kikoeru-test:latest
    env_file: .env
    environment:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kikoeru}:${POSTGRES_PASSWORD}@db:5432/kikoeru_test
      TEST_REDIS_URL: redis://redis:6379/15
      MEDIA_DIR: /tmp/kikoeru-test/media
      UPLOAD_DIR: /tmp/kikoeru-test/uploads
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      GEOCODER_ENABLED: "false"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["test"]
    profiles: ["test"]
