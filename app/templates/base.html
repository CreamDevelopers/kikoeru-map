<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ t('app.name') }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ t('app.tagline') }}{% endblock %}">
  <meta name="theme-color" content="#00796b">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{{ asset('icons/icon-32.png') }}" type="image/png" sizes="32x32">
  <link rel="icon" href="{{ asset('icons/icon-192.png') }}" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="{{ asset('icons/apple-touch-icon.png') }}">
  <script nonce="{{ nonce }}">
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <script type="importmap" nonce="{{ nonce }}">{{ import_map() }}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
  <link rel="stylesheet" href="{{ asset('css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}page{% endblock %}">
  <a class="skip-link" href="#main">{{ t('a11y.skip') }}</a>
  {% block body %}{% endblock %}
  <script type="application/json" id="i18n" nonce="{{ nonce }}">{{ i18n_json }}</script>
  {% block scripts %}{% endblock %}
</body>
</html>
